name: check

on:
  push:
  pull_request:

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every quote has a source
        run: python3 scripts/check_sources.py
      - name: dist/steve-full.md is up to date
        run: |
          python3 scripts/build_single_file.py
          git diff --exit-code -- dist/steve-full.md || (echo "dist/steve-full.md is stale: run scripts/build_single_file.py and commit" && exit 1)
