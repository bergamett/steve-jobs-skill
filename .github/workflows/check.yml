name: check

on:
  push:
  pull_request:

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every quote has a source
        run: python3 scripts/check_sources.py
